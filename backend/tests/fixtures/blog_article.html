  <h1>Building a Mindful Reading Habit</h1>
  <p>Reading slowly is a skill. Start with a short passage and remove notifications for ten minutes.</p>
  <p>Keep a notebook nearby and write one sentence about what you noticed.</p>
  <p>Over time, the habit becomes easier and the reading becomes more deliberate.</p>
