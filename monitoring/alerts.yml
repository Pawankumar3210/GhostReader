groups:
  - name: ghost-reader
    rules:
      - alert: GhostReaderApiDown
        expr: up{job="ghost-reader-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ghost Reader API is unreachable.
          description: Prometheus has failed to scrape the API for more than two minutes.

      - alert: GhostReaderHighErrorRate
        expr: |
          sum(rate(ghost_reader_http_requests_total{job="ghost-reader-api",status=~"5.."}[5m]))
          /
          sum(rate(ghost_reader_http_requests_total{job="ghost-reader-api"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Ghost Reader API error rate is above 5%.
          description: More than 5% of API requests have returned 5xx for five minutes.

      - alert: GhostReaderHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(ghost_reader_http_request_duration_seconds_bucket{job="ghost-reader-api"}[5m])
            )
          )
          > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ghost Reader API p95 latency is above two seconds.
          description: The API has sustained p95 latency above two seconds for ten minutes.

      - alert: GhostReaderRateLimitSpike
        expr: sum(rate(ghost_reader_rate_limit_rejections_total{job="ghost-reader-api"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ghost Reader is rejecting traffic due to rate limits.
          description: More than one request per second is being rate-limited for ten minutes.
